# STAR STAGING (alliance-research-indicators-main, branch staging): CI on GitHub Actions, finalization on Jenkins
# (CI-only job roar-monorepo-staging-ci, devops PIPES/ALLIANCE-INDICATORS/monorepo/staging/github-actions-ci/Jenkinsfile).
# Same model as Reporting Tool STAGING (onecgiar_pr reporting-tool-staging-ci.yml).
#
#   push to staging -> GitHub Actions (lint, tests) -> roar-monorepo-staging-ci (verify, record, final Slack)
#
# CI only: no build, no image, no ECR, no deploy, no migrations, no AWS access, no application secret. The legacy job
# roar-monorepo-staging (devops PIPES/ALLIANCE-INDICATORS/monorepo/staging/Jenkinsfile) ran the same npm commands on the
# Jenkins agent with the DEV backend and frontend secrets; here:
#   * the backend lint and tests need no configuration (the specs set their own values; proven by star-dev-cicd.yml);
#   * the frontend lint and tests use an inert CI environment file (.github/ci/star-frontend-environment.ci.ts): no real
#     endpoint, no credential, no Secrets Manager read.
# The staging copy of jenkins-trigger-monorepo.yml no longer starts roar-monorepo-staging on push (cutover); it stays
# available for manual recovery (workflow_dispatch of jenkins-trigger-monorepo.yml from staging, or Jenkins).
#
# Trigger: push to staging only. There is no workflow_dispatch: roar-monorepo-staging-ci accepts only `push` runs of
# this workflow. There is no pull_request trigger.
#
# Contract with roar-monorepo-staging-ci (keep in sync with the Jenkinsfile):
#   workflow path .github/workflows/star-staging-ci.yml, event push, branch staging;
#   required jobs: 'backend checks (lint, test)', 'frontend checks (lint, test)', 'CI script checks (bash -n, ShellCheck)';
#   parameters (jenkins-ci-finalize.reusable.yml): GIT_COMMIT_SHA, GIT_REF, GH_RUN_ID, GH_RUN_URL.
#
# Slack (#notifications-platform, Reporting Tool format, title [STAR NEW ENVIRONMENT] (STAGING); never duplicated):
#   started      GitHub Actions, at the start of the run (job notify-start, no needs)
#   failed       GitHub Actions, only when a check or the Jenkins hand-over failed (Jenkins is not called then)
#   succeeded    Jenkins roar-monorepo-staging-ci, after it verified the run (post block)
#
# GitHub Environment star-staging: deployment branch staging only, admins cannot bypass, no variables and no secrets
# (gate of the Jenkins hand-over only). Jenkins: repository secrets JENKINS_USERNAME and JENKINS_API_TOKEN (the same as
# jenkins-trigger-monorepo.yml). Slack: organization secret SLACK_NOTIFICATIONS_WEBHOOK_URL; without it the
# notifications are skipped with a warning and never block the pipeline.
#
# Action pinning: every `uses:` is a full commit SHA (same SHAs as star-dev-cicd.yml):
#   actions/checkout    v7.0.1  3d3c42e5aac5ba805825da76410c181273ba90b1
#   actions/setup-node  v7.0.0  820762786026740c76f36085b0efc47a31fe5020
# The local reusable workflows (./.github/workflows/*.reusable.yml) run from this same commit.
name: star-staging-ci

on:
  push:
    branches: [staging]

permissions: {}

concurrency:
  group: star-staging-ci-${{ github.ref }}
  cancel-in-progress: false

env:
  CI: 'true'

jobs:
  # ---------------------------------------------------------------- start notification
  # Runs in parallel with the checks and never blocks them.
  notify-start:
    name: notify start (Slack)
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: started
      title: STAR NEW ENVIRONMENT
      project: STAR
      environment-label: STAGING
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}

  # ---------------------------------------------------------------- mandatory checks (no Docker, no AWS)
  # Same commands as the legacy job (L47-L141), on the runner, with no secret.
  backend-checks:
    name: backend checks (lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: server/researchindicators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The version of the backend Dockerfile (node:22.23.4-alpine), as star-dev-cicd.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22.23.4
          cache: npm
          cache-dependency-path: server/researchindicators/package-lock.json
      - name: Install dependencies (lockfile)
        run: npm ci --no-audit --no-fund
      # `eslint ... --fix` as the legacy job: fixes stay on this runner, nothing is committed or published.
      - name: Lint
        run: npm run lint
      - name: Unit tests
        run: npm run test

  frontend-checks:
    name: frontend checks (lint, test)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    defaults:
      run:
        working-directory: client/research-indicators
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The major version of the frontend Dockerfile (node:20-alpine), as star-dev-cicd.yml.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: client/research-indicators/package-lock.json
      - name: Install dependencies (lockfile)
        run: bash "$GITHUB_WORKSPACE/.github/scripts/without-oidc.sh" npm ci --no-audit --no-fund
      - name: CI environment file (inert values, no credentials)
        run: |
          set -euo pipefail
          f=src/environments/environment.ts
          git check-ignore -q "$f" || { echo "::error::$f is not git-ignored (fail closed)"; exit 1; }
          install -m 0644 "$GITHUB_WORKSPACE/.github/ci/star-frontend-environment.ci.ts" "$f"
      - name: Lint
        run: bash "$GITHUB_WORKSPACE/.github/scripts/without-oidc.sh" npm run lint
      # jest --coverage with the project's own thresholds (jest.config.ts), as the legacy job.
      - name: Unit tests with coverage
        run: bash "$GITHUB_WORKSPACE/.github/scripts/without-oidc.sh" npm run test:coverage
      - name: Remove the environment file and the caches that hold copies of it
        if: always()
        working-directory: .
        run: bash .github/scripts/remove-frontend-config.sh

  ci-script-checks:
    name: CI script checks (bash -n, ShellCheck)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Syntax
        run: |
          for f in .github/scripts/*.sh; do bash -n "$f"; done
      - name: ShellCheck (preinstalled on the runner)
        run: shellcheck --severity=warning .github/scripts/*.sh

  # ---------------------------------------------------------------- Jenkins finalization
  # Only when every check passed: Jenkins verifies the run, records it and posts the final Slack message. Does not wait.
  finalize:
    name: finalize (Jenkins roar-monorepo-staging-ci)
    needs: [backend-checks, frontend-checks, ci-script-checks]
    if: >-
      needs.backend-checks.result == 'success'
      && needs.frontend-checks.result == 'success'
      && needs.ci-script-checks.result == 'success'
    permissions: {}
    uses: ./.github/workflows/jenkins-ci-finalize.reusable.yml
    with:
      jenkins-job: roar-monorepo-staging-ci
      environment: star-staging
    secrets:
      JENKINS_USERNAME: ${{ secrets.JENKINS_USERNAME }}
      JENKINS_API_TOKEN: ${{ secrets.JENKINS_API_TOKEN }}

  # ---------------------------------------------------------------- CI failure notification
  # Only when the run failed before Jenkins accepted the request. Jenkins is not called on failure.
  notify-ci-failure:
    name: notify CI failure (Slack)
    needs: [backend-checks, frontend-checks, ci-script-checks, finalize]
    if: ${{ always() && (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')) }}
    permissions: {}
    uses: ./.github/workflows/slack-notify.reusable.yml
    with:
      status: failed
      title: STAR NEW ENVIRONMENT
      project: STAR
      environment-label: STAGING
      detail: >-
        backend-checks=${{ needs.backend-checks.result }},
        frontend-checks=${{ needs.frontend-checks.result }},
        ci-script-checks=${{ needs.ci-script-checks.result }},
        jenkins-hand-over=${{ needs.finalize.result }}
    secrets:
      SLACK_NOTIFICATIONS_WEBHOOK_URL: ${{ secrets.SLACK_NOTIFICATIONS_WEBHOOK_URL }}
