<div class="relative flex flex-col gap-4 bg-[#F4F7F9] border border-[#E8EBED] p-5 mb-4">
  <div class="flex justify-between gap-1">
    <span class="text-[13px] text-[#8D9299] font-['Space_Grotesk'] tracking-widest">{{ headerLabel }} # {{ quantNumber
      }}</span>
    @if (submission.isEditableStatus()) {
    <button type="button" class="cursor-pointer text-[#CF0808] bg-transparent border-0 p-0"
      [attr.aria-label]="'Remove ' + headerLabel + ' ' + quantNumber" (click)="onDelete()">
      <i class="pi pi-times-circle !text-[16px] pr-1"></i>
    </button>
    }
  </div>

  <div class="grid grid-cols-1 xl:grid-cols-2 gap-4">
    <div>
      <!-- @akili-spec docs/specs/changes/measure-number-signed-decimal (T-10 — DD-4: min/max/placeholder promoted to inputs) -->
      <!-- @akili-spec docs/specs/changes/innovation-use-required-fields (T-03 — DD-4: fieldsRequired split; requiredMode forwarded) -->
      <h2 class="label">Number@if (numberRequired) {<span class="text-[15px] text-[#CF0808]">*</span>}</h2>
      <app-input [signal]="body" [optionValue]="'number'" [isRequired]="numberRequired" [requiredMode]="numberRequiredMode"
        [type]="'number'" [min]="min" [max]="max" [maxFractionDigits]="maxFractionDigits" [disabled]="disabled"
        [placeholder]="placeholder" (ngModelChange)="onValueChange()"></app-input>
    </div>
    <div>
      <h2 class="label">Unit@if (unitRequired) {<span class="text-[15px] text-[#CF0808]">*</span>}</h2>
      <app-input [signal]="body" [optionValue]="'unit'" [isRequired]="unitRequired" [requiredMode]="unitRequiredMode"
        [disabled]="disabled" placeholder="Write the unit" (ngModelChange)="onValueChange()"></app-input>
    </div>
  </div>

  <div>
    <!-- @akili-spec docs/specs/changes/innovation-use-required-fields (T-03 — DD-4: fieldsRequired split; commentsRequired, no requiredMode on app-textarea) -->
    <h2 class="label">Comments@if (commentsRequired) {<span class="text-[15px] text-[#CF0808]">*</span>}</h2>
    <app-textarea [signal]="body" [optionValue]="'comments'" [isRequired]="commentsRequired" [rows]="5" [disabled]="disabled"
      placeholder="Write the comments"></app-textarea>
  </div>
</div>
