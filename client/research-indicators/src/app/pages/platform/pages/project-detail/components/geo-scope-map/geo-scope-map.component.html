<div class="geo-scope-map relative h-full min-h-[220px] w-full overflow-hidden rounded-xl border border-[var(--ac-primary-blue-100)] bg-[var(--ac-grey-100)]">
  <section #mapContainer class="geo-scope-map__canvas h-full min-h-[220px] w-full"
    aria-label="Geographic distribution map"></section>

  @if (geocodingLoading()) {
  <div
    class="absolute inset-0 z-10 flex flex-col items-center justify-center gap-2 bg-[var(--ac-white-1)]/80 px-4 text-center backdrop-blur-[1px]">
    <app-custom-progress-bar></app-custom-progress-bar>
    <span class="font-['Barlow'] text-[13px] text-[var(--ac-grey-700)]">Loading map locations…</span>
  </div>
  }

  @if (mapError()) {
  <div class="absolute inset-x-0 bottom-0 z-10 bg-[var(--ac-background)] px-4 py-3 text-center">
    <p class="m-0 font-['Barlow'] text-[13px] text-[var(--ac-red-1)]">Map could not be loaded. Check the Mapbox access token.
    </p>
  </div>
  }

  @if (showEmptyState() && !geocodingLoading() && !mapError()) {
  <div class="absolute inset-x-0 bottom-0 z-10 px-4 py-3 text-center">
    <p class="m-0 font-['Barlow'] text-[13px] text-[var(--ac-grey-700)]">No geographic points could be resolved for this project.
    </p>
  </div>
  }
</div>
