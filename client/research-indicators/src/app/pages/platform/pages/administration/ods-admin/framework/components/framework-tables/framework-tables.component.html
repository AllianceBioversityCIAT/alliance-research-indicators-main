<div class="flex flex-col gap-3" data-testid="framework-tables">
  @if (noMatches()) {
    <p class="framework-tables__empty" role="status" data-testid="framework-table-search-empty">No elements match "{{ trimmedQuery() }}"</p>
  } @else {
    <app-data-table
      [columns]="columns"
      [rows]="filteredRows()"
      [showToolbar]="false"
      emptyMessage="No elements yet."
      [selectable]="true"
      [keyboardSelectable]="true"
      [selectedKey]="selectedKey()"
      (rowSelected)="onRowSelected($event)"
      data-testid="framework-data-table">
    </app-data-table>
  }
</div>
