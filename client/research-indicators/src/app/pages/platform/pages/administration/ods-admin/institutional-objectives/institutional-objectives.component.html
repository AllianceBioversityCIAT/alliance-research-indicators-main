<div class="app-page-wrapper objectives-page" [style.--objectives-column-height]="columnHeight()" data-testid="objectives-page">
  <div class="objectives-page__body">
    <section class="flex w-full min-w-0 flex-col gap-[18px]" [attr.aria-busy]="loading()">
      <div class="flex flex-wrap items-start justify-between gap-4" data-testid="page-header">
        <div class="flex flex-col gap-[2px]">
          <p class="m-0 text-[12px] font-semibold tracking-wide atc-primary-blue-600" data-testid="eyebrow">ADMIN · ODS</p>
          <h1 class="m-0 font-['Barlow'] text-[17px] font-bold leading-normal atc-primary-blue-600" data-testid="page-title">
            Institutional Objectives
          </h1>
        </div>

        <div class="flex flex-col gap-1">
          <label for="objectivePortfolio" class="text-sm font-medium atc-grey-800">Portfolio</label>
          <p-select
            #portfolioSelect
            inputId="objectivePortfolio"
            [options]="portfolioOptions()"
            optionLabel="label"
            optionValue="id"
            [ngModel]="portfolioId()"
            (onChange)="onPortfolioChange($event.value)"
            [disabled]="portfolioOptions().length === 0"
            styleClass="min-w-[240px]"
            ariaLabel="Portfolio"
            data-testid="portfolio-select">
          </p-select>
        </div>
      </div>

      <div class="flex flex-wrap items-end gap-3" data-testid="objective-toolbar">
        <div class="flex flex-col gap-1">
          <label for="objectivePageYear" class="text-sm font-medium atc-grey-800">Year</label>
          <p-select
            #yearSelect
            inputId="objectivePageYear"
            [options]="yearOptions()"
            optionLabel="label"
            optionValue="year"
            [ngModel]="year()"
            (onChange)="onYearChange($event.value)"
            [disabled]="yearOptions().length === 0 || loading()"
            styleClass="min-w-[220px]"
            ariaLabel="Year"
            data-testid="year-select">
          </p-select>
        </div>

        <p-button
          [label]="carryLabel()"
          icon="pi pi-copy !text-[12px]"
          severity="secondary"
          size="small"
          styleClass="!rounded-[9px] !text-[13px]"
          [disabled]="!canCarryForward()"
          (onClick)="requestCarryForward()"
          data-testid="carry-forward">
        </p-button>

        <p-button
          label="Add objective"
          icon="pi pi-plus !text-[12px]"
          severity="info"
          size="small"
          styleClass="!rounded-[9px] !text-[13px]"
          [disabled]="loading() || portfolioId() === null"
          (onClick)="openCreate($event)"
          data-testid="add-objective">
        </p-button>
      </div>

      @if (carryError(); as message) {
        <p class="m-0 text-sm leading-[1.5] atc-red-1" role="alert" data-testid="carry-forward-error">{{ message }}</p>
      }
      @if (deleteError(); as message) {
        <p class="m-0 text-sm leading-[1.5] atc-red-1" role="alert" data-testid="delete-error">{{ message }}</p>
      }

      @if (loading()) {
        <app-custom-progress-bar></app-custom-progress-bar>
      } @else if (loadError()) {
        <div class="flex flex-col items-center justify-center gap-2 p-8" data-testid="error-state" role="alert">
          <p class="m-0 text-sm atc-red-1">{{ loadError() }}</p>
          <p-button
            label="Retry"
            icon="pi pi-refresh !text-[12px]"
            severity="secondary"
            size="small"
            styleClass="!rounded-[9px] !text-[13px]"
            (onClick)="load()"
            data-testid="retry-button">
          </p-button>
        </div>
      } @else {
        <app-side-panel-layout
          [hasSelection]="selectedId() !== null"
          [creating]="creating()"
          panelLabel="Objective details">
          <app-ods-empty-panel
            circleIcon="pi pi-flag"
            title="Explore the institutional objectives"
            subtitle="Select an objective to see its statement, year and linked indicators."
            [rows]="emptyRows()" />
          <div list data-testid="objectives-list">
            <div data-testid="objectives-table">
              <app-data-table
                [columns]="columns"
                [rows]="objectiveRows()"
                [searchFields]="searchFields"
                [exportFileName]="exportFileName()"
                [selectable]="true"
                [keyboardSelectable]="true"
                [selectedKey]="selectedKey()"
                (rowSelected)="onRowSelected($event)"
                searchPlaceholder="Search code or statement"
                emptyMessage="No institutional objectives for this year yet.">
              </app-data-table>
            </div>
          </div>
          <div panel data-testid="objective-panel-slot">
            @if (selectedId() !== null || creating()) {
              <app-objective-panel
                [portfolioId]="portfolioId() ?? 0"
                [years]="yearNumbers()"
                [selectedYear]="year()"
                [objectiveId]="selectedId()"
                [creating]="creating()"
                [createToken]="createToken()"
                [objectives]="objectives()"
                [framework]="framework()"
                (dirty)="onDirty($event)"
                (saved)="onSaved($event)"
                (cancelled)="onCancelled($event)"
                (deleteRequested)="onDelete()">
              </app-objective-panel>
            }
          </div>
        </app-side-panel-layout>
      }
    </section>
  </div>
</div>
