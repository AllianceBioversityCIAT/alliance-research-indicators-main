<div class="ods-find">
  <label class="ods-find__label" [attr.for]="inputId()">{{ label() }}</label>
  <div class="ods-find__field">
    <input
      [id]="inputId()"
      type="text"
      class="ods-find__input"
      [attr.data-testid]="inputTestId()"
      [attr.placeholder]="placeholder()"
      autocomplete="off"
      [value]="value()"
      (input)="onInput($event)" />
    @if (value()) {
      <button type="button" class="ods-find__clear" [attr.data-testid]="clearTestId()" aria-label="Clear search" (click)="clear()">
        <i class="pi pi-times" aria-hidden="true"></i>
      </button>
    }
  </div>
</div>
