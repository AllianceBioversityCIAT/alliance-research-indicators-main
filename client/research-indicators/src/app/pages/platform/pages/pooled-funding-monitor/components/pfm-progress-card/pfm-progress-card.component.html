<section
  class="rounded-[14px] border border-solid border-[color:var(--ac-pfm-surface-border)] bg-[var(--ac-pfm-surface)] p-5 md:p-6"
  data-testid="pfm-progress-card"
  aria-labelledby="pfm-progress-title">
  @let p = progress();
  <h2 id="pfm-progress-title" class="m-0 text-[15px] font-semibold leading-6 text-[var(--ac-pfm-accent-navy)]">Reported to PRMS</h2>
  @if (p.total === 0) {
    <app-pfm-empty-state />
  } @else {
  <!-- Same language as the cards below: a dot legend, then one thick rounded bar with the percentage inside, big enough to stand out. Done is ONE part (in PRMS + no SP contribution). -->
  <p class="m-0 mt-3 flex flex-wrap gap-x-5 gap-y-1 text-[12px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-progress-legend">
    <span class="inline-flex items-center gap-2"><span class="h-3 w-3 rounded-[4px]" [style.background-color]="doneFill" aria-hidden="true"></span>Done: in PRMS or no SP contribution</span>
    <span class="inline-flex items-center gap-2"><span class="h-3 w-3 rounded-[4px]" [style.background-color]="emptyFill" aria-hidden="true"></span>Still to do</span>
  </p>
  <div class="mt-3 flex h-[48px] w-full overflow-hidden rounded-lg" [style.background-color]="emptyFill" data-testid="pfm-progress-bar">
    @if (p.done) {
      <span
        class="flex h-full items-center"
        tabindex="0"
        role="img"
        [style.width]="p.doneWidth"
        [style.background-color]="doneFill"
        [pTooltip]="p.doneTip"
        tooltipEvent="both"
        tooltipPosition="top"
        [attr.aria-label]="p.doneTip"
        data-testid="pfm-progress-done">
        @if (p.labelInside) {
          <span class="px-4 text-[24px] font-bold leading-none tabular-nums text-[var(--ac-pfm-surface)]" aria-hidden="true" data-testid="pfm-progress-percent">{{ p.percent }}%</span>
        }
      </span>
    }
    @if (p.left) {
      <span
        class="flex h-full flex-1 items-center"
        tabindex="0"
        role="img"
        [pTooltip]="p.leftTip"
        tooltipEvent="both"
        tooltipPosition="top"
        [attr.aria-label]="p.leftTip"
        data-testid="pfm-progress-left">
        <!-- A thin green part cannot hold the label: it sits just after it, on the grey -->
        @if (!p.labelInside) {
          <span class="px-4 text-[24px] font-bold leading-none tabular-nums" [style.color]="doneFg" aria-hidden="true" data-testid="pfm-progress-percent">{{ p.percent }}%</span>
        }
      </span>
    }
  </div>
  <span class="sr-only">{{ p.percent }}% done</span>
  }
</section>
