<section class="h-full rounded-[14px] border border-solid border-[color:var(--ac-pfm-surface-border)] bg-[var(--ac-pfm-surface)] p-5 md:p-6" data-testid="pfm-type-card" aria-labelledby="pfm-type-title">
  <h2 id="pfm-type-title" class="m-0 text-[15px] font-semibold leading-6 text-[var(--ac-pfm-accent-navy)]">Synced results by type</h2>
  <p class="m-0 mt-1 text-[13px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-type-sub">
    Results already in PRMS, by result type. Impact case reports (OICRs) stay in STAR and are not synced.
  </p>
  @if (view().length === 0) {
    <app-pfm-empty-state />
  } @else {
  <ul class="m-0 mt-4 flex list-none flex-col gap-3 p-0">
    @for (t of view(); track t.id) {
      <li
        class="grid grid-cols-[minmax(0,1fr)_minmax(0,1fr)_2.5rem] items-center gap-x-4 px-1 py-1 sm:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)_2.5rem]"
        [attr.data-testid]="'pfm-type-row-' + t.id">
        <span class="min-w-0 truncate text-[13px] text-[var(--ac-pfm-accent-navy)]" data-testid="pfm-type-label">{{ t.name }}</span>
        <div class="h-[14px]">
          <div
            class="flex h-full w-full overflow-hidden rounded-md"
            [style.background-color]="trackFill"
            [pTooltip]="t.name + ': ' + t.synced + (t.synced === 1 ? ' result' : ' results') + ' in PRMS'"
            tooltipPosition="top">
            <div class="h-full rounded-md" [style.width]="t.width" [style.background-color]="barFill" data-testid="pfm-type-bar"></div>
          </div>
        </div>
        <span class="text-right font-mono text-[12px] tabular-nums text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-type-count">{{ t.synced }}</span>
      </li>
    }
  </ul>
  }
</section>
