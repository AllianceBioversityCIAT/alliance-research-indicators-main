<div
  class="flex h-[18px] w-full overflow-hidden rounded-full"
  [style.background-color]="emptyFill"
  role="img"
  [attr.aria-label]="label()"
  data-testid="pfm-state-bar">
  @for (s of bar(); track s.key) {
    <div
      class="h-full"
      [style.flex-grow]="s.value"
      [style.flex-basis]="0"
      [style.background-color]="s.fill"
      [pTooltip]="s.label + ': ' + (s.value | number) + ' (' + s.share + '%) — ' + s.help"
      tooltipPosition="top"
      [attr.data-testid]="'pfm-state-seg-' + s.key"></div>
  }
</div>
<ul class="m-0 mt-3 grid list-none grid-cols-1 gap-x-4 gap-y-2 p-0 sm:grid-cols-2" data-testid="pfm-state-legend">
  @for (s of view(); track s.key) {
    <li class="flex items-center gap-2 text-[13px]" [attr.data-testid]="'pfm-state-item-' + s.key">
      <span class="h-3 w-3 flex-none rounded-[3px]" [style.background-color]="s.fill" aria-hidden="true"></span>
      <span
        class="min-w-0 cursor-help text-[var(--ac-pfm-accent-navy)] underline decoration-dotted decoration-[color:var(--ac-grey-400)] underline-offset-2"
        tabindex="0"
        [pTooltip]="s.help"
        tooltipEvent="both"
        tooltipPosition="top"
        data-testid="pfm-state-label"
        >{{ s.label }}</span
      >
      <span class="ml-auto font-semibold tabular-nums" [style.color]="s.fg" data-testid="pfm-state-value">{{ s.value | number }}</span>
      <span class="w-9 text-right text-[12px] tabular-nums text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-state-share">{{ s.share }}%</span>
      <span class="sr-only">{{ s.help }}</span>
    </li>
  }
</ul>
