<!-- @akili-spec docs/specs/bilateral/prms-sync/pooled-funding-monitor — T-13 -->
<section
  class="overflow-hidden rounded-[14px] border border-solid border-[color:var(--ac-pfm-surface-border)] bg-[var(--ac-pfm-surface)]"
  [attr.data-testid]="'pfm-group-' + group().code">
  <button
    type="button"
    class="relative flex w-full cursor-pointer flex-wrap items-center gap-x-6 gap-y-3 border-0 bg-transparent px-6 py-4 text-left transition-colors duration-200 focus-visible:outline focus-visible:outline-2"
    data-testid="pfm-group-toggle"
    [attr.aria-expanded]="open()"
    [attr.aria-controls]="'pfm-group-body-' + group().code"
    (click)="store.toggleGroup(group().code)">
    <span
      class="w-auto shrink-0 whitespace-nowrap rounded-lg bg-[var(--ac-pfm-neutral-bg)] px-3 py-2 font-mono text-[13px] font-bold leading-snug text-[var(--ac-pfm-accent-navy)]"
      data-testid="pfm-group-code"
      >{{ group().code }}</span
    >
    <span class="min-w-0 flex-1 basis-60">
      <span class="block text-[15px] font-semibold text-[var(--ac-pfm-accent-navy)]" data-testid="pfm-group-name">{{ group().name }}</span>
      @if (leadLine(); as lead) {
        <span class="mt-1 block text-[13px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-group-lead">{{ lead }}</span>
      }
    </span>
    <span class="text-[13px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-group-count">{{ countLabel() }}</span>
    <!-- Same rule and colour as the coverage tab's Reported to PRMS bar (done = in PRMS or no SP contribution) -->
    <span
      class="flex h-3 w-[190px] overflow-hidden rounded-full"
      [style.background-color]="emptyFill"
      [attr.title]="barSummary()"
      aria-hidden="true"
      data-testid="pfm-group-bar">
      @if (progress().done > 0) {
        <span class="h-full rounded-full" [style.width]="progress().width" [style.background-color]="doneFill" data-testid="pfm-group-done"></span>
      }
    </span>
    <span class="sr-only" data-testid="pfm-group-bar-summary">{{ barSummary() }}</span>
    <span
      class="inline-flex items-center whitespace-nowrap rounded-full border border-solid px-3.5 py-1 text-[12px] font-semibold {{
        group().attention
          ? 'border-[color:var(--ac-state-alert-fg)] bg-[color-mix(in_srgb,var(--ac-state-alert-fill)_10%,transparent)] text-[var(--ac-state-alert-fg)]'
          : 'border-[color:var(--ac-state-done-fg)] bg-[color-mix(in_srgb,var(--ac-state-done-fill)_10%,transparent)] text-[var(--ac-state-done-fg)]'
      }}"
      data-testid="pfm-group-flag"
      >{{ flagLabel() }}</span
    >
    <i class="pi shrink-0 !text-[10px] !leading-none text-[var(--ac-pfm-neutral-fg)] {{ open() ? 'pi-chevron-up' : 'pi-chevron-down' }}" aria-hidden="true"></i>
  </button>

  @if (open()) {
    <div [id]="'pfm-group-body-' + group().code" class="flex flex-col border-0 border-t border-solid border-[color:var(--ac-pfm-surface-border)]" data-testid="pfm-group-body">
      @if (error()) {
        <div class="flex items-center gap-3 px-6 py-4 text-[13px] text-[var(--ac-pfm-danger-fg)]" role="alert" data-testid="pfm-group-error">
          <span>Could not load the results of this project.</span>
          <button
            type="button"
            class="cursor-pointer border-0 bg-transparent p-0 text-[13px] font-semibold text-[var(--ac-pfm-info-fg)] underline"
            data-testid="pfm-group-retry"
            (click)="store.retryGroup(group().code)">
            Retry
          </button>
        </div>
      } @else if (loading()) {
        <div class="flex flex-col gap-2 px-6 py-3" aria-busy="true" data-testid="pfm-rows-skeleton">
          @for (i of skeletons; track i) {
            <div class="h-10 animate-pulse rounded-md bg-[var(--ac-pfm-neutral-bg)]" data-testid="pfm-row-skeleton"></div>
          }
        </div>
      } @else {
        <!-- Same table recipe as the Results Center: search + Clear (no Apply Filters), sort per column, paginator -->
        <div class="bg-[var(--ac-white-1)] px-5 py-4" data-testid="pfm-group-search">
          <app-search-export-controls
            [showApply]="false"
            [showClear]="true"
            [searchValue]="search()"
            [searchPlaceholder]="'Find a result by code, title, creator, status or Science Program'"
            (searchChange)="setSearch($event)"
            (clear)="clear()" />
        </div>
        <div class="w-full overflow-x-auto border-0 border-t border-solid border-[color:var(--ac-grey-200)]">
          <p-table
            #dt
            [value]="tableRows()"
            [paginator]="tableRows().length > 0"
            [rows]="pageSize()"
            [first]="first()"
            (onPage)="first.set($event.first); pageSize.set($event.rows)"
            [rowsPerPageOptions]="[5, 10, 25, 50]"
            paginatorDropdownAppendTo="body"
            [showCurrentPageReport]="true"
            currentPageReportTemplate="Showing {first} to {last} of {totalRecords} results"
            paginatorStyleClass="justify-end! border-t border-[color:var(--ac-grey-200)] bg-[color:var(--ac-white-1)] px-3 py-2"
            [scrollable]="true"
            [tableStyle]="{ 'min-width': '100%' }"
            styleClass="p-datatable-gridlines table-custom-styles p-datatable-hoverable-rows"
            [attr.aria-label]="'Results of project ' + group().code"
            data-testid="pfm-group-table">
            <ng-template pTemplate="header">
              <tr>
                @for (c of columns; track c.header) {
                  <th scope="col" class="atc-primary-blue-600 whitespace-nowrap" [pSortableColumn]="c.sort" [attr.data-testid]="'pfm-col-' + c.sort">
                    <div class="flex items-center gap-2 text-[14px] font-[500] leading-4.5">
                      {{ c.header }}
                      <p-sortIcon [field]="c.sort"></p-sortIcon>
                    </div>
                  </th>
                }
              </tr>
            </ng-template>
            <ng-template pTemplate="body" let-r>
              <tr app-pfm-result-row [row]="r"></tr>
            </ng-template>
            <ng-template pTemplate="emptymessage">
              <tr>
                <td [attr.colspan]="columns.length" class="!py-6 text-center text-[13px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-group-empty">
                  @if (search()) {
                    No results match “{{ search() }}”.
                  } @else {
                    No results in this project.
                  }
                </td>
              </tr>
            </ng-template>
          </p-table>
        </div>
      }
    </div>
  }
</section>
