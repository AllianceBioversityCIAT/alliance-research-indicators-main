<!-- @akili-spec docs/specs/bilateral/prms-sync/pooled-funding-monitor — T-13 -->
<div class="{{ grid }} border-0 border-t border-solid border-[color:var(--ac-pfm-surface-border)] px-7 py-5 text-[14px]" data-testid="pfm-result-row">
  <div class="min-w-0">
    <a
      class="text-[17px] font-medium leading-snug text-[var(--ac-pfm-info-fg)] no-underline hover:underline focus-visible:underline focus-visible:outline focus-visible:outline-2"
      data-testid="pfm-row-title"
      [routerLink]="link().commands"
      [queryParams]="link().queryParams"
      >{{ row().title || row().result_code }}</a
    >
    <p class="m-0 mt-1 text-[14px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-row-meta">
      <span class="font-mono">{{ row().result_code }}</span> · {{ row().type }}
    </p>
  </div>
  <div class="flex min-w-0 flex-col items-start gap-1">
    <app-pfm-status-badge kind="star" [value]="row().star_label" />
    <p class="m-0 text-[14px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-row-pi-line">{{ row().pi_line }}</p>
  </div>
  <div class="flex min-w-0 flex-col items-start gap-1">
    <app-pfm-status-badge kind="mapping" [value]="row().mapping_state" />
    @if (row().mapping_note) {
      <p class="m-0 text-[14px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-row-mapping-note">{{ row().mapping_note }}</p>
    }
    @if (row().sp_line) {
      <p class="m-0 text-[14px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-row-sp-line">{{ row().sp_line }}</p>
    }
    @if (row().primary_sp; as sp) {
      <app-pfm-status-badge kind="sp" [value]="sp.name" [color]="sp.color" />
    }
  </div>
  <div [attr.title]="row().prms_hint" data-testid="pfm-row-prms">
    <app-pfm-status-badge kind="prms" [value]="row().prms_status" />
  </div>
  <p class="m-0 text-[12px] tabular-nums text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-row-updated">{{ row().updated_at }}</p>
  <div class="flex justify-end">
    <a
      class="inline-flex cursor-pointer items-center rounded-lg border border-solid border-[color:var(--ac-pfm-surface-border)] bg-[var(--ac-pfm-surface)] px-5 py-2 text-[16px] font-medium text-[var(--ac-pfm-accent-navy)] no-underline transition-colors duration-200 focus-visible:outline focus-visible:outline-2"
      data-testid="pfm-row-view"
      [routerLink]="link().commands"
      [queryParams]="link().queryParams"
      >View</a
    >
  </div>
</div>
