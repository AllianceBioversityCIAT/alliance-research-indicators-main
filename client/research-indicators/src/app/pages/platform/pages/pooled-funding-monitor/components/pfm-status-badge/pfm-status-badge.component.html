@if (isNotSent()) {
  <span class="text-[var(--ac-pfm-neutral-fg)]" role="img" aria-label="Not sent" data-testid="pfm-badge-not-sent">—</span>
} @else {
  <span
    class="inline-flex items-center text-[14px] font-medium whitespace-nowrap tabular-nums {{ shapeClasses() }} {{ toneClasses() }}"
    [style.--sp]="spVar()"
    data-testid="pfm-badge"
    >{{ value() }}</span
  >
}
