<div class="flex flex-col gap-4" data-testid="pfm-coverage-tab">
  <!-- Total that should contribute (1/4), then the progress (3/4), same height -->
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-[1fr_3fr]">
    <section
      class="flex h-full flex-col items-center justify-center text-center rounded-[14px] border border-solid border-[color:var(--ac-pfm-surface-border)] bg-[var(--ac-pfm-surface)] p-5 md:p-6"
      data-testid="pfm-total-card"
      aria-labelledby="pfm-total-title">
      <h2 id="pfm-total-title" class="m-0 text-[15px] font-semibold leading-6 text-[var(--ac-pfm-accent-navy)]">Results that should contribute to the CGIAR Portfolio</h2>
      <p class="m-0 mt-3 text-[40px] font-bold leading-none tabular-nums text-[var(--ac-pfm-accent-navy)]" data-testid="pfm-total-value">{{ counts().all | number }}</p>
    </section>
    <app-pfm-progress-card class="h-full" [counts]="counts()" (open)="openQueue.emit({ chip: $event })" />
  </div>
  <app-pfm-next-steps-card [counts]="counts()" (open)="openQueue.emit({ chip: $event })" />
  <div class="grid grid-cols-1 gap-4 lg:grid-cols-3">
    <app-pfm-sp-coverage-card [rows]="summary().sp_coverage" [scope]="scope()" (openSp)="openQueue.emit({ sp: $event })" />
    <app-pfm-prms-status-card [pipeline]="summary().pipeline" (open)="openQueue.emit({ chip: $event })" />
    <app-pfm-sync-activity-card [monthly]="summary().monthly" [syncedThisYear]="summary().synced_this_year" [scope]="scope()" />
  </div>
</div>
