<ul class="m-0 grid list-none grid-cols-2 gap-4 p-0 xl:grid-cols-4" data-testid="pfm-kpi-cards">
  @for (c of cards(); track c.key) {
    <li
      class="flex flex-col gap-2 rounded-[14px] border border-solid border-l-4 bg-[var(--ac-pfm-surface)] px-5 py-4 {{ c.accent }} {{ c.frame }}"
      [attr.data-testid]="'pfm-kpi-' + c.key">
      <p class="m-0 font-['Barlow'] text-[12px] font-semibold uppercase leading-4 tracking-[0.1em] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-kpi-label">{{ c.label }}</p>
      <div class="mt-auto flex items-baseline gap-3">
        <span class="font-['Barlow'] text-[40px] font-bold leading-none tabular-nums {{ c.ink }}" data-testid="pfm-kpi-value">{{ c.value.toLocaleString('en-US') }}</span>
        <span class="font-['Barlow'] text-[14px] leading-5 text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-kpi-sub">{{ c.sub }}</span>
      </div>
    </li>
  }
</ul>
