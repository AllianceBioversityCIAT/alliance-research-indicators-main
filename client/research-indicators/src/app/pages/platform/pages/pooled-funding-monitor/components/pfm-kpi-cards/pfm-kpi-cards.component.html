<ul class="m-0 grid w-full list-none grid-cols-1 items-stretch gap-3 p-0 sm:grid-cols-3" data-testid="pfm-kpi-cards">
  @for (c of cards(); track c.key) {
    <li
      class="flex min-h-[112px] flex-col items-start gap-2 rounded-lg border border-solid border-l-[3px] bg-[color:var(--ac-grey-100)] px-4 py-3.5 {{ c.accent }} {{ c.frame }}"
      [attr.data-testid]="'pfm-kpi-' + c.key">
      <span class="sr-only" data-testid="pfm-kpi-help">{{ c.help }}</span>
      <span class="flex items-center gap-[5px]">
        <i class="pi {{ c.icon }} {{ c.iconInk }} shrink-0 !text-[13px] leading-4" aria-hidden="true"></i>
        <span
          class="atc-grey-600 cursor-help font-['Space_Grotesk'] text-[11px] font-medium uppercase leading-4 underline decoration-dotted underline-offset-2"
          tabindex="0"
          [pTooltip]="c.help"
          tooltipEvent="both"
          tooltipPosition="top"
          data-testid="pfm-kpi-label"
          >{{ c.label }}</span
        >
      </span>
      <div class="mt-auto flex items-baseline gap-2">
        <span class="font-['Space_Grotesk'] text-[28px] font-semibold leading-8 tabular-nums {{ c.ink }}" data-testid="pfm-kpi-value">{{ c.value.toLocaleString('en-US') }}</span>
        @if (c.subHelp) {
          <span
            class="atc-grey-600 cursor-help text-[12px] underline decoration-dotted underline-offset-2"
            tabindex="0"
            [pTooltip]="c.subHelp"
            tooltipEvent="both"
            tooltipPosition="top"
            data-testid="pfm-kpi-sub"
            >{{ c.sub }}</span
          >
        } @else {
          <span class="atc-grey-600 text-[12px]" data-testid="pfm-kpi-sub">{{ c.sub }}</span>
        }
      </div>
    </li>
  }
</ul>
