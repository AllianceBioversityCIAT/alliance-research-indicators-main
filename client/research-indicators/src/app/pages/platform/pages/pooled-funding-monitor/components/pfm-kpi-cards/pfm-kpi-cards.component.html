<ul class="m-0 grid w-full list-none grid-cols-1 items-stretch gap-3 p-0 sm:grid-cols-2 xl:grid-cols-4" data-testid="pfm-kpi-cards">
  @for (c of cards(); track c.key) {
    <li
      class="flex flex-col items-start gap-1 rounded-lg border border-solid border-l-[3px] bg-[color:var(--ac-grey-100)] px-2.5 py-1.5 {{ c.accent }} {{ c.frame }}"
      [attr.data-testid]="'pfm-kpi-' + c.key">
      <span class="flex items-center gap-[5px]">
        <i class="pi {{ c.icon }} {{ c.iconInk }} shrink-0 !text-[13px] leading-4" aria-hidden="true"></i>
        <span class="atc-grey-600 font-['Space_Grotesk'] text-[11px] font-medium uppercase leading-4" data-testid="pfm-kpi-label">{{ c.label }}</span>
      </span>
      <div class="mt-auto flex items-baseline gap-2">
        <span class="font-['Space_Grotesk'] text-[18px] font-semibold leading-5 tabular-nums {{ c.ink }}" data-testid="pfm-kpi-value">{{ c.value.toLocaleString('en-US') }}</span>
        <span class="atc-grey-600 text-[12px]" data-testid="pfm-kpi-sub">{{ c.sub }}</span>
      </div>
    </li>
  }
</ul>
