<section class="h-full rounded-[14px] border border-solid border-[color:var(--ac-pfm-surface-border)] bg-[var(--ac-pfm-surface)] p-5 md:p-6" data-testid="pfm-sp-card" aria-labelledby="pfm-sp-title">
  <h2 id="pfm-sp-title" class="m-0 text-[16px] font-semibold leading-6 text-[var(--ac-pfm-accent-navy)]">Coverage by Science Program</h2>
  <p class="m-0 mt-1 text-[13px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-sp-sub">{{ copy().sub }}</p>
  <p class="m-0 mt-1 text-[12px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-sp-how">{{ help.spHowToRead }}</p>
  <p class="m-0 mt-4 flex gap-5 text-[12px] text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-sp-legend">
    <span class="inline-flex items-center gap-2" tabindex="0" [pTooltip]="help.spSynced" tooltipEvent="both" tooltipPosition="top"
      ><span class="h-3 w-3 rounded-[4px]" [style.background-color]="syncedFill" aria-hidden="true"></span
      ><span data-testid="pfm-sp-legend-synced">{{ copy().synced }}</span></span
    >
    <span class="inline-flex items-center gap-2" tabindex="0" [pTooltip]="help.spNotSynced" tooltipEvent="both" tooltipPosition="top"
      ><span class="h-3 w-3 rounded-[4px]" [style.background-color]="unsyncedFill" aria-hidden="true"></span
      ><span data-testid="pfm-sp-legend-unsynced">{{ copy().unsynced }}</span></span
    >
  </p>
  <ul class="m-0 mt-4 flex list-none flex-col gap-3 p-0">
    @for (r of view(); track r.code) {
      <li [attr.data-testid]="'pfm-sp-row-' + r.code">
        <button
          type="button"
          class="grid w-full cursor-pointer grid-cols-[minmax(0,1fr)_minmax(0,1fr)_auto] items-center gap-x-4 rounded-md border-0 bg-transparent px-1 py-1 text-left transition-colors duration-200 hover:bg-[var(--ac-pfm-neutral-bg)] focus-visible:outline focus-visible:outline-2 sm:grid-cols-[minmax(0,1.3fr)_minmax(0,1fr)_4.5rem]"
          [attr.aria-label]="r.code + ' ' + r.name + ': ' + r.synced + ' of ' + r.total + ' in PRMS. See its results.'"
          [attr.data-testid]="'pfm-sp-open-' + r.code"
          (click)="openSp.emit(r.code)">
        <span class="min-w-0 truncate text-[13px] text-[var(--ac-pfm-accent-navy)]" data-testid="pfm-sp-label">{{ r.code }} — {{ r.name }}</span>
        <!-- Same full length for every program (its 100%); the navy part is what is already in PRMS -->
        <div class="h-[18px]">
          <div
            class="flex h-full w-full overflow-hidden rounded-md"
            [style.background-color]="unsyncedFill"
            [pTooltip]="r.code + ': ' + r.synced + ' in PRMS, ' + r.unsynced + ' not yet (' + r.total + ' results)'"
            tooltipPosition="top"
            data-testid="pfm-sp-total-bar">
            <div class="h-full" [style.width]="r.wSynced" [style.background-color]="syncedFill" data-testid="pfm-sp-synced-bar"></div>
          </div>
        </div>
        <span class="text-right font-mono text-[12px] tabular-nums text-[var(--ac-pfm-neutral-fg)]" data-testid="pfm-sp-count">{{ r.synced }} / {{ r.total }}</span>
        </button>
      </li>
    }
  </ul>
</section>
