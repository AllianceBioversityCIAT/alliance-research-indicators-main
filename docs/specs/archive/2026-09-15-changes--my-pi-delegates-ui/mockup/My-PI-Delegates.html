document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

er;justify-content:center;width:17px;height:17px;border:none;border-radius:4px;background:rgba(31,106,97,.12);color:#1F6A61;cursor:pointer;padding:0\" style-hover=\"background:#B3261E;color:#fff\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end\"><button sc-camel-on-click=\"{{ prtEditMarta }}\" style=\"background:#fff;color:#1B7FD6;border:1px solid #BBD8F0;border-radius:5px;padding:7px 13px;font:500 12.5px Poppins,sans-serif;white-space:nowrap;cursor:pointer\" style-hover=\"background:#F1F7FD;border-color:#1B7FD6\">Edit projects<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:2.3fr 2fr 2.6fr 1.2fr;gap:16px;align-items:center;padding:16px 28px;border-bottom:1px solid #EDF0F3\">\n<div style=\"display:flex;align-items:center;gap:11px\"><div style=\"width:34px;height:34px;flex:none;border-radius:50%;background:#EDEFF3;color:#54626F;display:flex;align-items:center;justify-content:center;font:600 12.5px Poppins,sans-serif\">PD<\u002Fdiv><div><div style=\"font-size:14px;font-weight:500;color:#0E2A47\">Pierre Dubois<\u002Fdiv><div style=\"font-size:11.5px;color:#7A8590\">Senior Scientist · Crop Systems<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:13px;color:#4A5866\">p.dubois@example.org<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\"><span style=\"display:inline-flex;align-items:center;gap:7px;background:#E9F5F3;border:1px solid #BFE0DA;color:#1F6A61;border-radius:5px;padding:5px 7px 5px 10px;font-size:11.5px;font-weight:600;white-space:nowrap\">A1032<button sc-camel-on-click=\"{{ prtAskRemove }}\" aria-label=\"Remove PI Delegate on A1032\" style=\"display:flex;align-items:center;justify-content:center;width:17px;height:17px;border:none;border-radius:4px;background:rgba(31,106,97,.12);color:#1F6A61;cursor:pointer;padding:0\" style-hover=\"background:#B3261E;color:#fff\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end\"><button sc-camel-on-click=\"{{ prtEditPierre }}\" style=\"background:#fff;color:#1B7FD6;border:1px solid #BBD8F0;border-radius:5px;padding:7px 13px;font:500 12.5px Poppins,sans-serif;white-space:nowrap;cursor:pointer\" style-hover=\"background:#F1F7FD;border-color:#1B7FD6\">Edit projects<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display:grid;grid-template-columns:2.3fr 2fr 2.6fr 1.2fr;gap:16px;align-items:center;padding:16px 28px;border-bottom:1px solid #EDF0F3\">\n<div style=\"display:flex;align-items:center;gap:11px\"><div style=\"width:34px;height:34px;flex:none;border-radius:50%;background:#EDEFF3;color:#54626F;display:flex;align-items:center;justify-content:center;font:600 12.5px Poppins,sans-serif\">KM<\u002Fdiv><div><div style=\"font-size:14px;font-weight:500;color:#0E2A47\">Kofi Mensah<\u002Fdiv><div style=\"font-size:11.5px;color:#7A8590\">Data Manager · MEL<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"font-size:13px;color:#4A5866\">kofi.mensah@example.org<\u002Fdiv>\n<div style=\"display:flex;flex-wrap:wrap;gap:7px\"><span style=\"display:inline-flex;align-items:center;gap:7px;background:#E9F5F3;border:1px solid #BFE0DA;color:#1F6A61;border-radius:5px;padding:5px 7px 5px 10px;font-size:11.5px;font-weight:600;white-space:nowrap\">A1198<button sc-camel-on-click=\"{{ prtAskRemove }}\" aria-label=\"Remove PI Delegate on A1198\" style=\"display:flex;align-items:center;justify-content:center;width:17px;height:17px;border:none;border-radius:4px;background:rgba(31,106,97,.12);color:#1F6A61;cursor:pointer;padding:0\" style-hover=\"background:#B3261E;color:#fff\"><svg width=\"9\" height=\"9\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"3.2\"><path d=\"M6 6l12 12M18 6L6 18\"><\u002Fpath><\u002Fsvg><\u002Fbutton><\u002Fspan><\u002Fdiv>\n<div style=\"display:flex;justify-content:flex-end\"><button sc-camel-on-click=\"{{ prtEditKofi }}\" style=\"background:#fff;color:#1B7FD6;border:1px solid #BBD8F0;border-radius:5px;padding:7px 13px;font:500 12.5px Poppins,sans-serif;white-space:nowrap;cursor:pointer\" style-hover=\"background:#F1F7FD;border-color:#1B7FD6\">Edit projects<\u002Fbutton><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n\n\n<div style=\"display:flex;align-items:center;justify-content:space-between;padding:16px 26px;border-top:1px solid #E6E9ED;font-size:13px;color:#6B7683\">\n<span>{{ prtFooter }}<\u002Fspan><span>Only projects where you are the Principal Investigator are listed<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n\n\n<\u002Fdiv>\n<p class=\"dv-next\">Try next: “add an empty state for a PI with no assistants yet” · “let the PI set an assignment end date”<\u002Fp>\n<\u002Fsection>\n\n\n\n\n\n<div class=\"dv-opt\" id=\"2c\" style=\"position: absolute; left: 1552px; top: 2206px\">\n\n\n<\u002Fdiv><div class=\"dv-opt\" id=\"1b\" style=\"position: absolute; left: 3544px; top: 2215px\">\n\n\n<\u002Fdiv><div class=\"dv-opt\" id=\"3c\" style=\"position: absolute; left: 1460px; top: 41px\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3c\">3c<\u002Fa>Delegation History — functional documentation for Jira<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:700px;padding:28px 30px 32px;box-sizing:border-box\">\n<div style=\"font-size:19px;font-weight:700;color:#0E2A47;letter-spacing:-.2px;margin-bottom:6px\">Delegation history — functional documentation<\u002Fdiv>\n<div style=\"font-size:12.5px;color:#7A8590;margin-bottom:20px\">STAR · My PI Delegates · Header history panel (<a href=\"#3a\">3a<\u002Fa>) · PI Delegate changes only<\u002Fdiv>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">PURPOSE<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">The Principal Investigator needs to account for who reviews results on their behalf and since when. The delegation history gives them that record: a single icon in the header of My PI Delegates opens a panel listing every time the PI Delegate role was granted or revoked on one of their projects, newest first. It is the same panel, wording and styling as the review team history of the project tab, so the two read as one feature seen from two places.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">It is a read-only record. Nothing can be edited, undone or deleted from the panel; it exists so the PI, the delegates and the administrators share one account of how the current delegation came to be.<\u002Fp>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">WHAT AN ENTRY SHOWS<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">Each entry is one change and reads as a sentence: the avatar and name of the person who made it, the action in plain language, the person affected, and the project it applies to. Below the sentence a single badge states the action and the role together — “PI Delegate granted” in green, “PI Delegate revoked” in red. The timestamp closes the entry with date, time and timezone.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">Because the panel spans all of the PI’s projects, the project code is part of every sentence; the same person may therefore appear several times, once per project. Only two events exist — granted and revoked — since PI Delegate is the only role this screen manages. Roles coming from Agresso are never listed.<\u002Fp>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">BEHAVIOUR<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">The history icon is the only action in the header of the screen and is visible to any user who has the Principal Investigator section, which is to say any PI of at least one project. The panel opens on click, stays anchored to the header, scrolls internally when the history is long, closes with the × and shows a counter of how many changes exist. A bulk assignment that creates several assignments at once produces one entry per person and project, so the record stays auditable at the level at which the role actually applies.<\u002Fp>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">BUSINESS RULES<\u002Fdiv>\n<div style=\"margin-top:2px\">\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-1<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Read-only record<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">The history is an audit log. No entry can be edited or deleted from the interface by any role, administrators included.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-2<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">What is recorded<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Two events only: PI Delegate granted and PI Delegate revoked. Each record stores the actor, the affected person, the action, the project and a timestamp with timezone.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-3<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">One badge per entry<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">The action and the role are shown together in a single badge — granted in green, revoked in red. No before/after pair is displayed.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-4<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Scope<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">The panel lists only the projects where the signed-in user is the Principal Investigator. Changes made by a Center Admin from User management on those projects appear here too, with the admin named as the actor.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-5<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Bulk assignments<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">A bulk assignment writes one entry per person and per project, never a single aggregated entry.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-6<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Agresso roles excluded<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Roles imported from Agresso are not part of the history, since they cannot be changed in STAR.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-7<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Visibility<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Any user with the Principal Investigator section can open the history for their own projects. No extra permission is required, and no other PI’s projects are ever shown.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-8<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Ordering and volume<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Entries are ordered newest first and paginate when they exceed the panel height; the counter states the total number of changes.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:46px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">DH-9<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Consistency<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Every action that grants or revokes PI Delegate — here, in the project review team tab or in User management — writes exactly one history entry per assignment, visible from all three places. An action that fails writes none.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"dv-opt\" id=\"3b\" style=\"position: absolute; left: -790px; top: 41px\">\n<div class=\"dv-olabel\"><a class=\"dv-oid\" href=\"#3b\">3b<\u002Fa>PI Review Team — functional documentation for Jira<\u002Fdiv>\n<div class=\"dv-card\" style=\"width:760px;padding:28px 32px 32px;box-sizing:border-box\">\n<div style=\"font-size:19px;font-weight:700;color:#0E2A47;letter-spacing:-.2px;margin-bottom:6px\">PI review team management — functional documentation<\u002Fdiv>\n<div style=\"font-size:12.5px;color:#7A8590;margin-bottom:20px\">STAR · Principal Investigator section · Covers the My PI Delegates screen (<a href=\"#3a\">3a<\u002Fa>)<\u002Fdiv>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">PURPOSE<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">My PI Delegates is the screen where a Principal Investigator manages, on their own, the people who review results on their behalf. Until now the PI Delegate role could only be granted project by project inside each project, or by a Center Admin from User management. This module gives the PI a single place to see their whole review team and to assign or revoke the role across several projects at once.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">It is deliberately not part of Administration. Administration is reserved for Center Admins and System Admins; this screen belongs to a new Principal Investigator section of the left menu, visible only to users who are the Principal Investigator of at least one project. The PI is not an administrator: the scope of everything they can do here is strictly their own projects.<\u002Fp>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">WHAT THE SCREEN SHOWS<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">The header summarises the situation in three figures: projects where the user is the Principal Investigator, how many people form the review team, and how many projects have no PI Delegate at all. The last figure is the actionable one and is presented in amber, because a project without an assistant is the gap the PI is expected to close.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">The same information can be read two ways, and <strong style=\"font-weight:600\">By project is the default<\u002Fstrong> because the PI’s natural question is which of their projects is covered. By project lists the PI’s projects with the assistants covering each one and highlights, in amber, any project with no assistant. By person lists each assistant once with the projects they cover as removable chips, answering what a given person has access to. Both views act on exactly the same data, and each row offers the action that fits it: Assign people on a project row, Edit projects on a person row.<\u002Fp>\n<div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">BULK ASSIGNMENT<\u002Fdiv>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">Assign PI Delegates opens a single vertical panel with two multi-select fields, People first and Projects below. Each field behaves like a normal form selector: it shows a placeholder when empty, the current selection as removable chips once filled, and expands in place into a list of options with checkboxes — a search box in the People field, a Select all shortcut in the Projects field, and a Done button to collapse it again. Accept stays disabled until at least one person and one project are selected, and it opens a confirmation dialog that names the people and states the effect of the change before anything is written. The result is reported in a success message on the screen.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">The panel is always opened pre-filled with the context of the row it was opened from, so it doubles as the edit screen. Assign people on a project row opens with that project selected and its current assistants already listed as chips; Edit projects on a person row opens with that person selected and the projects they already cover already checked. From the header button the panel opens empty. In every case the PI can add or remove chips before accepting, which means the same panel is used to grant, to extend and to correct an assignment.<\u002Fp>\n<p style=\"margin:0 0 12px;font-size:13.5px;line-height:1.7;color:#3A4854;text-wrap:pretty\">Revoking works the same way in reverse and is available directly in the tables: removing a project chip from a person row, or a person chip from a project row, asks for confirmation naming the person and the project before the assignment is deleted.<\u002Fp><div style=\"font-size:11px;font-weight:600;letter-spacing:.5px;color:#8B95A1;margin:26px 0 10px\">BUSINESS RULES<\u002Fdiv>\n<div style=\"margin-top:2px\">\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-1<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Who sees the section<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">The Principal Investigator section appears only for users who are the Principal Investigator of at least one active project. It is independent of Center Admin and System Admin; being an administrator does not grant it, and holding it does not grant any administration right.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-2<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Scope<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">A PI can only assign, view and revoke PI Delegate on the projects where they are the Principal Investigator of record in Agresso. No other project of the center is selectable.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-3<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Only PI Delegate<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">This module grants exactly one role, PI Delegate, which is a STAR role and never comes from Agresso. Project roles imported from Agresso are not shown and cannot be changed here.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-4<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Effect of the role<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">PI Delegate allows the person to approve, reject or request changes to the results reported under the selected project, on behalf of the PI. It grants no access to other projects and no administration rights.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-5<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Bulk operation<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Selecting N people and M projects creates N × M assignments. Assignments that already exist are kept as they are rather than duplicated. Accept is disabled until at least one person and one project are selected.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-6<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Eligible people<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Any active STAR user of the center can be assigned, including people who already hold other roles. A PI cannot assign the role to themselves.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-7<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Confirmation<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Bulk assignment and every revocation require an explicit confirmation dialog naming the people, the projects and the effect, followed by a success message. No role change is ever written on a single click.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-8<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Consistency with the project<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">An assignment made here is identical to one made inside the project members tab; both write the same record and are visible from both places, as well as from User management.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-9<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Revocation<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">A PI can revoke any PI Delegate they granted on their own projects. A Center Admin can also revoke it from User management; the PI sees the change reflected here.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-10<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Audit<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Every assignment and revocation records who made it, on whom, on which project and when.<\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-11<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Pre-filled context<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">Opening the panel from a row pre-loads that row’s context: a project row pre-selects the project and its current assistants, a person row pre-selects the person and the projects already covered. Accepting a pre-filled panel with chips removed revokes those assignments, so the same panel serves to grant, extend and correct.<\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<div style=\"display:flex;gap:13px;padding:13px 0;border-top:1px solid #EDF0F3\"><div style=\"width:52px;flex:none;font:600 10.5px ui-monospace,Menlo,monospace;color:#356B38;background:#EDF7EE;border:1px dashed #A8CFAB;border-radius:4px;height:22px;display:flex;align-items:center;justify-content:center\">PIRT-12<\u002Fdiv><div><div style=\"font-size:13px;font-weight:600;color:#0E2A47;margin-bottom:3px\">Default view<\u002Fdiv><div style=\"font-size:13px;line-height:1.65;color:#4A5866\">The screen opens on By project. Projects with no PI Delegate are highlighted and counted in the header so the PI can see at a glance where review support is missing.<\u002Fdiv><\u002Fdiv><\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\">\nclass Component extends DCLogic {\n  state = { removed: false, toast: null, confirming: false, adding: false,\n    centerRoles: [], view: 'list', pi: { b2210: 'star', e5520: 'star' }, umModal: null, umToast: null,\n    prtView: 'project', prtBulk: false, prtPeopleSel: [], prtProjSel: [], prtPeopleOpen: false, prtProjOpen: false, prtModal: null, prtToast: null };\n\n  projectCatalog() {\n    return [\n      { code: 'F8890 · 01/02/2025 – 31/01/2028', title: 'FAO – Agroecological transitions in Andean highlands', pi: 'Ana Duarte' },\n      { code: 'H3320 · 15/09/2024 – 14/09/2026', title: 'USAID – Digital soil information services for East Africa', pi: 'Kofi Mensah' },\n      { code: 'J1145 · 01/04/2023 – 31/03/2026', title: 'IDRC – Gender-responsive breeding for legume systems', pi: 'Isabelle Dubois' }\n    ];\n  }\n\n  umAsk(kind, key, project) { this.setState({ umModal: { kind, key, project }, umToast: null }); }\n\n  umApply() {\n    const m = this.state.umModal;\n    if (!m) return;\n    const base = this.state.centerRoles || [];\n    if (m.kind === 'role-add') {\n      this.setState({ centerRoles: base.concat([m.role]), umModal: null, roleToast: m.role + ' granted to Pierre Dubois. The role applies center-wide in STAR and can be removed at any time.' });\n      return;\n    }\n    if (m.kind === 'role-remove') {\n      this.setState({ centerRoles: base.filter(x => x !== m.role), umModal: null, roleToast: m.role + ' removed from Pierre Dubois. The role no longer applies anywhere in STAR.' });\n      return;\n    }\n    if (m.kind === 'revoke-extra') {\n      this.setState({ extraProjects: (this.state.extraProjects || []).filter(x => x.code !== m.code), umModal: null, umToast: 'PI Delegate revoked on project ' + m.project + '. Pierre Dubois can no longer approve, reject or request changes to its results.' });\n      return;\n    }\n    if (m.kind === 'proj-add') {\n      const all = this.projectCatalog();\n      const picked = all.filter(p => (this.state.projSel || []).indexOf(p.code) > -1);\n      this.setState({ extraProjects: (this.state.extraProjects || []).concat(picked), projSel: [], umModal: null,\n        umToast: 'PI Delegate granted on ' + picked.length + ' project(s): ' + picked.map(p => p.code.split(' ')[0]).join(', ') + '. Pierre Dubois can now approve, reject or request changes to the results reported under them.' });\n      return;\n    }\n    const pi = Object.assign({}, this.state.pi);\n    let msg;\n    if (m.kind === 'bulk') {\n      Object.keys(pi).forEach(k => { if (pi[k] === 'none') pi[k] = 'star'; });\n      msg = 'PI Delegate granted to Pierre Dubois on all eligible projects. He can now approve, reject or request changes to the results of those projects.';\n    } else if (m.kind === 'delegate') {\n      pi[m.key] = 'star';\n      msg = 'PI Delegate granted on project ' + m.project + '. Pierre Dubois can now approve, reject or request changes to the results reported under it.';\n    } else {\n      pi[m.key] = 'none';\n      msg = 'PI Delegate revoked on project ' + m.project + '. Pierre Dubois can no longer approve, reject or request changes to its results.';\n    }\n    this.setState({ pi, umModal: null, umToast: msg });\n  }\n\n  prtCatalogPeople() {\n    return [\n      { ini: 'MS', name: 'Marta Silva', mail: 'marta.silva@example.org' },\n      { ini: 'PD', name: 'Pierre Dubois', mail: 'p.dubois@example.org' },\n      { ini: 'KM', name: 'Kofi Mensah', mail: 'kofi.mensah@example.org' },\n      { ini: 'AD', name: 'Ana Duarte', mail: 'collaborator@example.org' },\n      { ini: 'LR', name: 'Lucia Romano', mail: 'lucia.romano@example.org' }\n    ];\n  }\n\n  prtCatalogProjects() {\n    return [\n      { code: 'A1032 · 04/05/2024 – 20/12/2026', title: 'EMBRAPA – International coconut gene bank' },\n      { code: 'A1041 · 01/03/2024 – 28/02/2027', title: 'Cassava seed systems in West Africa' },\n      { code: 'A1198 · 15/01/2025 – 14/01/2028', title: 'Climate resilience of sorghum landraces' },\n      { code: 'D7781 · 01/07/2023 – 30/06/2026', title: 'Banana bacterial wilt surveillance network' }\n    ];\n  }\n\n  prtOpenFor(code) {\n    const current = { A1032: ['Marta Silva', 'Pierre Dubois'], A1041: ['Marta Silva'], A1198: ['Kofi Mensah'], D7781: [] };\n    const p = this.prtCatalogProjects().filter(x => x.code.indexOf(code) === 0);\n    this.setState({ prtBulk: true, prtToast: null, prtPeopleSel: (current[code] || []).slice(), prtProjSel: p.map(x => x.code), prtPeopleOpen: true, prtProjOpen: false });\n  }\n\n  prtEditPerson(name, codes) {\n    const projs = this.prtCatalogProjects().filter(p => codes.indexOf(p.code.split(' ')[0]) > -1).map(p => p.code);\n    this.setState({ prtBulk: true, prtToast: null, prtPeopleSel: [name], prtProjSel: projs, prtPeopleOpen: false, prtProjOpen: true });\n  }\n\n  prtApplyModal() {\n    const m = this.state.prtModal;\n    if (!m) return;\n    if (m.kind === 'bulk') {\n      const pn = (this.state.prtPeopleSel || []).length, pj = (this.state.prtProjSel || []).length;\n      this.setState({ prtModal: null, prtBulk: false, prtPeopleSel: [], prtProjSel: [], prtPeopleOpen: false, prtProjOpen: false,\n        prtToast: pn * pj + ' assignment(s) created. ' + (this.state.prtPeopleSel || []).join(', ') + ' can now approve, reject or request changes to the results of ' + pj + ' of your project(s).' });\n      return;\n    }\n    this.setState({ prtModal: null, prtToast: 'PI Delegate revoked. The person can no longer review results on your behalf for that project.' });\n  }\n\n  renderVals() {\n    const removed = this.state.removed;\n    const histOpen = !!this.state.histOpen;\n    const pi = this.state.pi;\n    const m = this.state.umModal;\n    const eligible = Object.keys(pi).filter(k => pi[k] === 'none').length;\n    const starCount = Object.keys(pi).filter(k => pi[k] === 'star').length + (this.state.extraProjects || []).length;\n    const names = { delegate: 'Grant PI Delegate on this project?', revoke: 'Revoke PI Delegate on this project?', bulk: 'Grant PI Delegate on ' + eligible + ' projects?' };\n    const bodies = {\n      delegate: 'Pierre Dubois will be able to approve, reject or request changes to the results reported under project ' + (m ? m.project : '') + '. This affects that project only.',\n      revoke: 'Pierre Dubois will no longer be able to approve, reject or request changes to the results reported under project ' + (m ? m.project : '') + '. Roles coming from Agresso are not affected.',\n      bulk: 'Pierre Dubois will be granted PI Delegate on every project where he does not already hold the role and is not the Principal Investigator. Assignments coming from Agresso stay unchanged.'\n    };\n    return {\n      histOpen: histOpen,\n      histBg: histOpen ? '#E6F0FA' : 'transparent',\n      togHist: () => this.setState({ histOpen: !this.state.histOpen }),\n      closeHist: () => this.setState({ histOpen: false }),\n      projOpen: !!this.state.projOpen,\n      togProj: () => this.setState({ projOpen: !this.state.projOpen, addOpen: false }),\n      addedProjects: (this.state.extraProjects || []).map(p => Object.assign({}, p, {\n        revoke: () => this.setState({ umModal: { kind: 'revoke-extra', code: p.code, project: p.code.split(' ')[0] }, umToast: null })\n      })),\n      eligibleProjects: this.projectCatalog().filter(p => ((this.state.extraProjects || []).map(x => x.code).indexOf(p.code) === -1))\n       .map(p => Object.assign({}, p, { picked: (this.state.projSel || []).indexOf(p.code) > -1, unpicked: (this.state.projSel || []).indexOf(p.code) === -1, toggle: () => { const s = (this.state.projSel || []).slice(); const i = s.indexOf(p.code); if (i > -1) s.splice(i, 1); else s.push(p.code); this.setState({ projSel: s }); } })),\n      projSelCount: (this.state.projSel || []).length,\n      projHasSel: (this.state.projSel || []).length > 0,\n      projNoSel: (this.state.projSel || []).length === 0,\n      projAsk: () => this.setState({ umModal: { kind: 'proj-add' }, projOpen: false, umToast: null }),\n      projClear: () => this.setState({ projSel: [], projOpen: false }),\n      noEligible: (this.state.extraProjects || []).length === 3,\n      a1032On: this.state.pi.a1032 === 'star', a1032Off: this.state.pi.a1032 !== 'star',\n      g177On: this.state.pi.g177 === 'star', g177Off: this.state.pi.g177 !== 'star',\n      c4410On: this.state.pi.c4410 === 'star', c4410Off: this.state.pi.c4410 !== 'star',\n      a1032Grant: () => this.umAsk('delegate','a1032','A1032'), a1032Revoke: () => this.umAsk('revoke','a1032','A1032'),\n      g177Grant: () => this.umAsk('delegate','g177','G177'), g177Revoke: () => this.umAsk('revoke','g177','G177'),\n      c4410Grant: () => this.umAsk('delegate','c4410','C4410'), c4410Revoke: () => this.umAsk('revoke','c4410','C4410'),\n      pdStarTotal: (this.state.centerRoles || []).length + 2,\n      addOpen: !!this.state.addOpen,\n      roleToast: !!this.state.roleToast,\n      roleToastMessage: this.state.roleToast,\n      roleDismiss: () => this.setState({ roleToast: null }),\n      togAdd: () => this.setState({ addOpen: !this.state.addOpen }),\n      starR
